[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scout"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pgvector>=0.3",
  "rapidfuzz>=3.6",
  "pypdf>=4.0",
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "markdownify>=0.12",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
scout = "scout.cli:app"

[tool.setuptools.packages.find]
include = ["scout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

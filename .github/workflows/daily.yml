name: daily

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      MAX_DAILY_COST_USD: ${{ vars.MAX_DAILY_COST_USD || '0.50' }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e .
      - id: gate
        run: scout cron-gate
      - if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5
      - if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.enabled == 'true'
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[embed]"
      - if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.enabled == 'true'
        run: alembic upgrade head
      - if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.enabled == 'true'
        run: scout companies sync
      - if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.enabled == 'true'
        run: scout run
